name: Build Win/Mac/Lin Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            jpackage_type: msi
            artifact_pattern: dist/*.msi
          - os: ubuntu-22.04
            arch: x64
            jpackage_type: deb
            artifact_pattern: dist/*.deb
          - os: macos-15
            arch: arm64
            jpackage_type: dmg
            artifact_pattern: dist/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: ${{ matrix.arch }}

      - name: Install Linux packaging tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg

      - name: Build JAR with Gradle
        uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean shadowJar

      - name: Stage JAR for jpackage
        shell: bash
        run: |
          mkdir -p staging dist
          cp build/libs/anti-chaos_tray-1.0.0-all.jar staging/app.jar

      - name: Package installer with jpackage
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXTRA_ARGS+=(
              --icon "packaging/icons/icon.icns"
              --mac-app-category "Utilities"
              --java-options "-Dapple.awt.UIElement=true"
            )
          elif [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_ARGS+=(
              --icon "packaging/icons/icon.ico"
              --win-menu
              --win-shortcut
              --java-options "-Dapple.awt.UIElement=true"
            )
          elif [ "${{ runner.os }}" = "Linux" ]; then
            EXTRA_ARGS+=(
              --icon "packaging/icons/icon.png"
              --linux-shortcut
              --java-options "-Dapple.awt.UIElement=true"
            )
          fi

          jpackage \
            --type "${{ matrix.jpackage_type }}" \
            --name "AntiChaos Notifications" \
            --app-version "1.0.0" \
            --vendor "Stefan Kozhuharov" \
            --input staging \
            --dest dist \
            --main-jar app.jar \
            --main-class space.istef.TrayApp \
            "${EXTRA_ARGS[@]}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiChaosNotifications-${{ runner.os }}-${{ matrix.arch }}
          path: ${{ matrix.artifact_pattern }}